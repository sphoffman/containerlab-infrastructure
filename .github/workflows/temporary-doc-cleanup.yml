name: Temporary DNS documentation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-doc-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix backend-neutral DNS wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('labmgmt/README.md')
          text = p.read_text()
          old = 'Publish them to BIND:\n\n```bash\nsudo labmgmt dns install\n```'
          new = 'Publish them to the selected DNS backend:\n\n```bash\nsudo labmgmt dns install\n```'
          if old not in text:
              raise SystemExit('expected documentation text not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/temporary-doc-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labmgmt/README.md
          git commit -m 'docs: make DNS publish wording backend-neutral'
          git push origin HEAD:main
